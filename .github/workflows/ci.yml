name: CI

on:
  push:
    branches: [main, dev, version-2]
  pull_request:
    branches: [main, dev, version-2]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint (fails on errors)
        run: npx eslint .

  test:
    name: Unit tests (Jest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Jest with coverage
        run: npm run test:coverage -- --ci
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  build:
    name: Build (Next.js)
    needs: [lint, test] # only runs if lint AND tests pass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the app
        run: npm run build

  # Proves db/schema.sql applies to an empty database and can be re-run safely.
  # Every schema change is exercised here before it can reach a real database.
  db-schema:
    name: Database schema (fresh Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spark_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spark_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spark_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply schema
        run: npm run db:migrate
      - name: Apply schema again (must be idempotent)
        run: npm run db:migrate
      - name: Verify the expected tables and columns exist
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE missing text;
          BEGIN
            SELECT string_agg(name, ', ')
              INTO missing
              FROM unnest(ARRAY[
                'users', 'editors', 'freelancers', 'assignments',
                'account_appeals', 'content_flags', 'roster_invites', 'pitches'
              ]) AS name
             WHERE to_regclass('public.' || name) IS NULL;
            IF missing IS NOT NULL THEN
              RAISE EXCEPTION 'Tables missing after migration: %', missing;
            END IF;

            SELECT string_agg(col, ', ')
              INTO missing
              FROM unnest(ARRAY['roles', 'photo_key', 'preferences', 'available_until', 'suspended_at']) AS col
             WHERE NOT EXISTS (
               SELECT 1
                 FROM information_schema.columns
                WHERE table_schema = 'public'
                  AND table_name = 'users'
                  AND column_name = col
             );
            IF missing IS NOT NULL THEN
              RAISE EXCEPTION 'users columns missing after migration: %', missing;
            END IF;
          END $$;
          SQL

  # Applies db/schema.sql to the deployed database once a commit is on main and
  # every other check has passed. Requires a DATABASE_URL secret holding the
  # Railway Postgres *public* URL, since hosted runners cannot resolve
  # *.railway.internal.
  db-migrate:
    name: Database migration (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, build, db-schema]
    runs-on: ubuntu-latest
    environment: production
    # Never let two migrations run at once, and never cut a running one short.
    concurrency:
      group: db-migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Check the database secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::No DATABASE_URL secret. Add the Railway Postgres public URL as a repository or production environment secret."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate
